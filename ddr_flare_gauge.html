<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>フレアゲージ計算</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation"></script>
    <style>
        :root {
            color-scheme: light;
            --bg: #f4f7ff;
            --panel: rgba(255, 255, 255, 0.82);
            --text: #1a2540;
            --muted: #5f6d8e;
            --accent: #4f7cff;
            --accent-strong: #7459ff;
            --outline: rgba(88, 112, 183, 0.22);
        }
        * { box-sizing: border-box; }
        body {
            font-family: "Inter", "Segoe UI", "Noto Sans JP", sans-serif;
            margin: 0;
            min-height: 100vh;
            color: var(--text);
            background:
                radial-gradient(circle at 12% 10%, rgba(79,124,255,.22), transparent 38%),
                radial-gradient(circle at 90% 8%, rgba(116,89,255,.2), transparent 34%),
                linear-gradient(180deg, #f8faff 0%, #eef3ff 100%);
            padding: 28px 14px 42px;
        }
        .container {
            width: min(980px, 100%);
            margin: 0 auto;
            padding: 26px;
            border-radius: 24px;
            border: 1px solid var(--outline);
            background: var(--panel);
            box-shadow: 0 28px 74px rgba(34, 55, 108, 0.14);
        }
        h2 { margin: 0; font-size: clamp(1.6rem, 2.4vw, 2.1rem); }
        .subtitle { margin: 8px 0 0; color: var(--muted); }
        .section {
            margin-top: 18px;
            background: #fff;
            border: 1px solid rgba(92, 116, 184, .2);
            border-radius: 16px;
            padding: 18px;
        }
        .section-title { font-size: .78rem; letter-spacing: .12em; color: var(--muted); margin-bottom: 10px; }
        #inputs { display: grid; gap: 12px; }
        .input-group { display: grid; grid-template-columns: 170px minmax(90px,120px); align-items:center; gap:10px; }
        .input-group label { text-align:right; color:var(--muted); font-weight:600; }
        .input-group input {
            width: 100%; padding: 9px 10px; border-radius: 10px; border: 1px solid #cdd8f6;
            background: #f7f9ff; color: var(--text); text-align: center; font-weight: 600;
        }
        .input-group input:focus { outline: 2px solid rgba(79,124,255,.35); border-color: var(--accent); }
        button {
            margin-top: 6px; justify-self: center; border: none; border-radius: 999px; padding: 11px 24px;
            background: linear-gradient(135deg, var(--accent), var(--accent-strong)); color: #fff; font-weight: 700; cursor: pointer;
        }
        button:hover { filter: brightness(1.05); }
        #result { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; }
        .result-box { padding:6px 12px; border-radius:999px; color:#fff; font-weight:700; }
        .chart-container { margin-top: 14px; border: 1px solid rgba(89,111,179,.22); background: #fcfdff; border-radius: 14px; padding: 12px; }
        .back-link {
            display:inline-flex; align-items:center; gap:6px; margin-bottom: 14px; padding: 8px 14px; border-radius: 999px;
            text-decoration: none; color: var(--accent); background: rgba(79,124,255,.12); font-weight: 700;
        }
        .back-link:hover { background: rgba(79,124,255,.18); }
        @media (max-width: 640px) {
            .container { padding: 18px; }
            .input-group { grid-template-columns: 1fr; }
            .input-group label { text-align: left; }
        }
    </style>
    <link rel="stylesheet" href="site.css">
</head>
<body>
    <div class="container">
        <a class="back-link" href="index.html">← インデックスへ戻る</a>
        <h2>フレアゲージ計算</h2>
        <p class="subtitle">DDR FLARE GAUGE · DAMAGE CHECK</p>
        <div class="section">
            <div class="section-title">Input</div>
            <div id="inputs">
                <!-- ユーザー入力欄 -->
                <div class="input-group">
                    <label>PERFECTの数:</label> <input type="number" id="perfect" value="0">
                </div>
                <div class="input-group">
                    <label>GREATの数:</label> <input type="number" id="great" value="0">
                </div>
                <div class="input-group">
                    <label>GOODの数:</label> <input type="number" id="good" value="0">
                </div>
                <div class="input-group">
                    <label>MISSの数:</label> <input type="number" id="miss" value="0">
                </div>
                <button onclick="calculateReduction()">計算</button>
            </div>
        </div>
        <div class="section">
            <div class="section-title">Result</div>
            <div id="result"></div>
            <div class="chart-container">
                <canvas id="gaugeChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        // ゲージの減少率を定義
        const reductionRates = {
            "FLARE I":    { "PERFECT": 0, "GREAT": 0.1,  "GOOD": 0.5,  "MISS": 1.5 },
            "FLARE II":   { "PERFECT": 0, "GREAT": 0.1,  "GOOD": 0.63, "MISS": 3   },
            "FLARE III":  { "PERFECT": 0, "GREAT": 0.1,  "GOOD": 0.75, "MISS": 4.5 },
            "FLARE IV":   { "PERFECT": 0, "GREAT": 0.29, "GOOD": 1.45, "MISS": 11  },
            "FLARE V":    { "PERFECT": 0, "GREAT": 0.74, "GOOD": 3.7,  "MISS": 16  },
            "FLARE VI":   { "PERFECT": 0, "GREAT": 0.92, "GOOD": 4.6,  "MISS": 18  },
            "FLARE VII":  { "PERFECT": 0, "GREAT": 1.28, "GOOD": 6.4,  "MISS": 22  },
            "FLARE VIII": { "PERFECT": 0, "GREAT": 1.64, "GOOD": 8.2,  "MISS": 26  },
            "FLARE IX":   { "PERFECT": 0, "GREAT": 2,    "GOOD": 10,   "MISS": 30  },
            "FLARE EX":   { "PERFECT": 1, "GREAT": 2,    "GOOD": 10,   "MISS": 30  }
        };

        let myChart;

        function calculateReduction() {
            const ctx = document.getElementById("gaugeChart").getContext("2d");
            const resultDiv = document.getElementById("result");
            resultDiv.innerHTML = "";

            // 入力値を取得し、数値化
            const perfectVal = parseFloat(document.getElementById("perfect").value) || 0;
            const greatVal   = parseFloat(document.getElementById("great").value)   || 0;
            const goodVal    = parseFloat(document.getElementById("good").value)    || 0;
            const missVal    = parseFloat(document.getElementById("miss").value)    || 0;

            const labels = Object.keys(reductionRates);
            const data = labels.map(gauge => {
                const rate = reductionRates[gauge];
                return (perfectVal * rate.PERFECT) +
                       (greatVal   * rate.GREAT)   +
                       (goodVal    * rate.GOOD)    +
                       (missVal    * rate.MISS);
            });
            const colors = data.map(dmg => (dmg >= 100 ? "red" : "skyblue"));

            // 結果を表示
            labels.forEach((gauge, i) => {
                const box = document.createElement("span");
                box.className = "result-box";
                box.style.backgroundColor = colors[i];
                box.textContent = `${gauge}: ${data[i].toFixed(1)} Damage`;
                resultDiv.appendChild(box);
            });

            updateChart(ctx, labels, data, colors);
        }

        function updateChart(ctx, labels, data, colors) {
            if (myChart) {
                myChart.destroy();
            }

            myChart = new Chart(ctx, {
                type: "bar",
                data: {
                    labels: labels,
                    datasets: [{ label: "Damage", data: data, backgroundColor: colors }]
                },
                options: {
                    indexAxis: 'y',
                    scales: { y: { beginAtZero: true, suggestedMax: 110 } },
                    plugins: {
                        annotation: {
                            annotations: {
                                line1: {
                                    type: 'line',
                                    xMin: 100,
                                    xMax: 100,
                                    borderColor: 'red',
                                    borderWidth: 2,
                                    borderDash: [5, 5],
                                    label: { content: '100 Damage', enabled: true, position: 'end' }
                                }
                            }
                        }
                    }
                }
            });
        }
    </script>
    <script src="site.js"></script>
</body>
</html>
