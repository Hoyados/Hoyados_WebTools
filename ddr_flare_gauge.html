<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>フレアゲージ計算</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation"></script>
    <style>
        :root {
            color-scheme: light;
            --bg: #0f1628;
            --panel: rgba(255, 255, 255, 0.08);
            --panel-strong: rgba(255, 255, 255, 0.14);
            --text: #e9edf7;
            --muted: #c4cbe1;
            --accent: #4be3ff;
            --accent-strong: #8b7bff;
        }
        * {
            box-sizing: border-box;
        }
        body {
            font-family: "Segoe UI", "Noto Sans JP", "Hiragino Sans", sans-serif;
            text-align: center;
            margin: 0;
            min-height: 100vh;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(75, 227, 255, 0.22), transparent 45%),
                radial-gradient(circle at top right, rgba(139, 123, 255, 0.2), transparent 45%),
                #0b1020;
        }
        .container {
            width: min(900px, 92vw);
            margin: 32px auto 48px;
            padding: 28px;
            border-radius: 18px;
            background: var(--panel);
            box-shadow: 0 24px 60px rgba(7, 9, 24, 0.55);
            backdrop-filter: blur(8px);
            position: relative;
            overflow: hidden;
        }
        .container::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(130deg, rgba(75, 227, 255, 0.6), rgba(139, 123, 255, 0.45), transparent 60%);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
            pointer-events: none;
        }
        h2 {
            margin-bottom: 8px;
            letter-spacing: 0.08em;
        }
        .subtitle {
            margin: 0 0 18px;
            color: var(--muted);
            font-size: 0.95rem;
        }
        h3 {
            color: var(--muted);
            font-weight: 600;
            margin-top: 28px;
        }
        .section {
            background: rgba(11, 18, 36, 0.7);
            border-radius: 16px;
            padding: 18px 20px 22px;
            margin-top: 16px;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.05);
        }
        .section-title {
            text-transform: uppercase;
            letter-spacing: 0.2em;
            font-size: 0.8rem;
            color: var(--muted);
            margin-bottom: 12px;
        }
        #inputs {
            display: grid;
            gap: 12px;
            justify-content: center;
        }
        .input-group {
            display: grid;
            grid-template-columns: 150px minmax(70px, 110px);
            gap: 10px;
            align-items: center;
            justify-content: center;
        }
        .input-group label {
            text-align: right;
            color: var(--muted);
            font-weight: 600;
        }
        .input-group input {
            width: 100%;
            padding: 8px 10px;
            text-align: center;
            border-radius: 10px;
            border: 1px solid transparent;
            background: var(--panel-strong);
            color: var(--text);
            font-weight: 600;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
        }
        .input-group input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(75, 227, 255, 0.3);
        }
        button {
            margin: 10px auto 0;
            padding: 10px 22px;
            border: none;
            border-radius: 999px;
            background: linear-gradient(135deg, var(--accent), var(--accent-strong));
            color: #08111f;
            font-weight: 700;
            letter-spacing: 0.08em;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 28px rgba(79, 200, 255, 0.35);
        }
        .chart-container {
            width: min(760px, 90vw);
            margin: 18px auto 0;
            padding: 12px;
            border-radius: 16px;
            background: rgba(10, 16, 34, 0.75);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06), 0 12px 24px rgba(5, 10, 24, 0.35);
        }
        #result {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
        }
        .result-box {
            padding: 6px 12px;
            border-radius: 999px;
            font-weight: 700;
            letter-spacing: 0.03em;
            display: inline-flex;
            align-items: center;
            color: #08111f;
            box-shadow: 0 6px 12px rgba(5, 10, 24, 0.25);
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 16px;
            padding: 8px 18px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.12);
            color: var(--text);
            text-decoration: none;
            font-weight: 600;
            transition: background 0.2s ease, transform 0.2s ease;
        }
        .back-link:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }
        @media (max-width: 600px) {
            .container {
                padding: 22px 18px;
            }
            .input-group {
                grid-template-columns: 1fr;
                text-align: left;
            }
            .input-group label {
                text-align: left;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a class="back-link" href="index.html">← インデックスへ戻る</a>
        <h2>フレアゲージ計算</h2>
        <p class="subtitle">DDR FLARE GAUGE · DAMAGE CHECK</p>
        <div class="section">
            <div class="section-title">Input</div>
            <div id="inputs">
                <!-- ユーザー入力欄 -->
                <div class="input-group">
                    <label>PERFECTの数:</label> <input type="number" id="perfect" value="0">
                </div>
                <div class="input-group">
                    <label>GREATの数:</label> <input type="number" id="great" value="0">
                </div>
                <div class="input-group">
                    <label>GOODの数:</label> <input type="number" id="good" value="0">
                </div>
                <div class="input-group">
                    <label>MISSの数:</label> <input type="number" id="miss" value="0">
                </div>
                <button onclick="calculateReduction()">計算</button>
            </div>
        </div>
        <div class="section">
            <div class="section-title">Result</div>
            <div id="result"></div>
            <div class="chart-container">
                <canvas id="gaugeChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        // ゲージの減少率を定義
        const reductionRates = {
            "FLARE I":    { "PERFECT": 0, "GREAT": 0.1,  "GOOD": 0.5,  "MISS": 1.5 },
            "FLARE II":   { "PERFECT": 0, "GREAT": 0.1,  "GOOD": 0.63, "MISS": 3   },
            "FLARE III":  { "PERFECT": 0, "GREAT": 0.1,  "GOOD": 0.75, "MISS": 4.5 },
            "FLARE IV":   { "PERFECT": 0, "GREAT": 0.29, "GOOD": 1.45, "MISS": 11  },
            "FLARE V":    { "PERFECT": 0, "GREAT": 0.74, "GOOD": 3.7,  "MISS": 16  },
            "FLARE VI":   { "PERFECT": 0, "GREAT": 0.92, "GOOD": 4.6,  "MISS": 18  },
            "FLARE VII":  { "PERFECT": 0, "GREAT": 1.28, "GOOD": 6.4,  "MISS": 22  },
            "FLARE VIII": { "PERFECT": 0, "GREAT": 1.64, "GOOD": 8.2,  "MISS": 26  },
            "FLARE IX":   { "PERFECT": 0, "GREAT": 2,    "GOOD": 10,   "MISS": 30  },
            "FLARE EX":   { "PERFECT": 1, "GREAT": 2,    "GOOD": 10,   "MISS": 30  }
        };

        let myChart;

        function calculateReduction() {
            const ctx = document.getElementById("gaugeChart").getContext("2d");
            const resultDiv = document.getElementById("result");
            resultDiv.innerHTML = "";

            // 入力値を取得し、数値化
            const perfectVal = parseFloat(document.getElementById("perfect").value) || 0;
            const greatVal   = parseFloat(document.getElementById("great").value)   || 0;
            const goodVal    = parseFloat(document.getElementById("good").value)    || 0;
            const missVal    = parseFloat(document.getElementById("miss").value)    || 0;

            const labels = Object.keys(reductionRates);
            const data = labels.map(gauge => {
                const rate = reductionRates[gauge];
                return (perfectVal * rate.PERFECT) +
                       (greatVal   * rate.GREAT)   +
                       (goodVal    * rate.GOOD)    +
                       (missVal    * rate.MISS);
            });
            const colors = data.map(dmg => (dmg >= 100 ? "red" : "skyblue"));

            // 結果を表示
            labels.forEach((gauge, i) => {
                const box = document.createElement("span");
                box.className = "result-box";
                box.style.backgroundColor = colors[i];
                box.textContent = `${gauge}: ${data[i].toFixed(1)} Damage`;
                resultDiv.appendChild(box);
            });

            updateChart(ctx, labels, data, colors);
        }

        function updateChart(ctx, labels, data, colors) {
            if (myChart) {
                myChart.destroy();
            }

            myChart = new Chart(ctx, {
                type: "bar",
                data: {
                    labels: labels,
                    datasets: [{ label: "Damage", data: data, backgroundColor: colors }]
                },
                options: {
                    indexAxis: 'y',
                    scales: { y: { beginAtZero: true, suggestedMax: 110 } },
                    plugins: {
                        annotation: {
                            annotations: {
                                line1: {
                                    type: 'line',
                                    xMin: 100,
                                    xMax: 100,
                                    borderColor: 'red',
                                    borderWidth: 2,
                                    borderDash: [5, 5],
                                    label: { content: '100 Damage', enabled: true, position: 'end' }
                                }
                            }
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
