<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoyados personal tools</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #0f1628;
            --panel: rgba(255, 255, 255, 0.08);
            --panel-strong: rgba(255, 255, 255, 0.14);
            --text: #e9edf7;
            --muted: #c4cbe1;
            --accent: #4be3ff;
            --accent-strong: #8b7bff;
            --chip: rgba(255, 255, 255, 0.14);
            --shadow: 0 24px 60px rgba(7, 9, 24, 0.55);
        }
        * {
            box-sizing: border-box;
        }
        body {
            font-family: "Segoe UI", "Noto Sans JP", "Hiragino Sans", sans-serif;
            background:
                radial-gradient(circle at top left, rgba(75, 227, 255, 0.22), transparent 45%),
                radial-gradient(circle at top right, rgba(139, 123, 255, 0.2), transparent 45%),
                #0b1020;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: var(--text);
            text-align: center;
            padding: 24px 16px;
        }
        .container {
            width: min(760px, 96vw);
            text-align: center;
            padding: 32px 28px 28px;
            background-color: var(--panel);
            border-radius: 22px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }
        .container::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(130deg, rgba(75, 227, 255, 0.6), rgba(139, 123, 255, 0.45), transparent 60%);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
            pointer-events: none;
        }
        h1 {
            margin: 0;
            font-size: clamp(1.6rem, 4vw, 2.2rem);
            letter-spacing: 0.03em;
        }
        .lead {
            margin: 10px auto 20px;
            color: var(--muted);
            max-width: 46ch;
            line-height: 1.6;
            font-size: 0.98rem;
        }
        .meta {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 999px;
            background: var(--chip);
            color: var(--muted);
            font-size: 0.8rem;
            letter-spacing: 0.03em;
            margin-bottom: 18px;
        }
        .link-list {
            display: grid;
            gap: 14px;
            margin-top: 6px;
        }
        .tool-link {
            text-decoration: none;
            color: inherit;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding: 15px 18px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
            text-align: left;
        }
        .tool-link:hover {
            transform: translateY(-2px);
            border-color: rgba(75, 227, 255, 0.45);
            background: rgba(75, 227, 255, 0.12);
        }
        .tool-main {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }
        .emoji {
            font-size: 1.1rem;
            width: 1.4rem;
            text-align: center;
        }
        .tool-title {
            font-weight: 700;
            letter-spacing: 0.02em;
        }
        .tool-sub {
            color: var(--muted);
            font-size: 0.86rem;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 50ch;
        }
        .arrow {
            color: var(--accent);
            font-weight: 700;
            font-size: 1.05rem;
            flex-shrink: 0;
        }
        .caption {
            margin-top: 18px;
            font-size: 0.86rem;
            color: var(--muted);
        }
        @media (max-width: 640px) {
            .container {
                width: 100%;
                padding: 24px 16px 18px;
                border-radius: 18px;
            }
            .tool-link {
                padding: 13px 14px;
            }
            .tool-sub {
                max-width: 34ch;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="meta">✨ Utility Portal</div>
        <h1>Hoyados Personal Tools</h1>
        <p class="lead">よく使うツールを、迷わずすぐ開けるようにまとめたランチャーです。作業内容にあわせて選んでください。</p>

        <div class="link-list">
            <a class="tool-link" href="ddr_flare_gauge.html">
                <div class="tool-main">
                    <span class="emoji">🎵</span>
                    <div>
                        <div class="tool-title">DDRフレアゲージ計算機</div>
                        <div class="tool-sub">判定数からフレアゲージ減少量を即時計算</div>
                    </div>
                </div>
                <span class="arrow">→</span>
            </a>
            <a class="tool-link" href="sorting_visualizer.html">
                <div class="tool-main">
                    <span class="emoji">📊</span>
                    <div>
                        <div class="tool-title">ソートアルゴリズム可視化ツール</div>
                        <div class="tool-sub">アルゴリズムの動きをアニメーションで比較</div>
                    </div>
                </div>
                <span class="arrow">→</span>
            </a>
            <a class="tool-link" href="csv_dashboard.html">
                <div class="tool-main">
                    <span class="emoji">🧾</span>
                    <div>
                        <div class="tool-title">CSV自動ダッシュボード</div>
                        <div class="tool-sub">CSV読み込みだけでチャートと集計を表示</div>
                    </div>
                </div>
                <span class="arrow">→</span>
            </a>
            <a class="tool-link" href="gacha_simulator.html">
                <div class="tool-main">
                    <span class="emoji">🎯</span>
                    <div>
                        <div class="tool-title">ガチャシミュレータ</div>
                        <div class="tool-sub">排出率と天井条件を設定して試行シミュレーション</div>
                    </div>
                </div>
                <span class="arrow">→</span>
            </a>
        </div>
        <div class="caption">Hoyados personal tools</div>
    </div>
</body>
</html>
