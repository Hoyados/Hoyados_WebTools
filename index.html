<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ベイズ成功確率推定ツール</title>
  <style>
    :root {
      --bg: #ffffff;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --accent: #2563eb;
      --accent-soft: #dbeafe;
      --danger: #b91c1c;
      --danger-bg: #fee2e2;
      --ok: #065f46;
      --ok-bg: #d1fae5;
      --shadow: 0 8px 24px rgba(17, 24, 39, 0.06);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.6;
    }

    .container {
      max-width: 980px;
      margin: 0 auto;
      padding: 20px 16px 32px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.4rem, 2.4vw, 1.9rem);
      line-height: 1.35;
    }

    .lead {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 0.97rem;
    }

    .panel {
      margin-top: 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .input-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .field label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 0.94rem;
    }

    .field input,
    .field select {
      width: 100%;
      height: 40px;
      border: 1px solid #cfd6e4;
      border-radius: 10px;
      padding: 0 10px;
      font-size: 1rem;
      background: #fff;
      color: var(--text);
    }

    .field input:focus,
    .field select:focus {
      outline: 2px solid var(--accent-soft);
      border-color: var(--accent);
    }

    .samples {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .sample-btn {
      border: 1px solid #c7d2fe;
      color: #1e3a8a;
      background: #eef2ff;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .error-box {
      margin-top: 12px;
      background: var(--danger-bg);
      color: var(--danger);
      border: 1px solid #fecaca;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.92rem;
      display: none;
    }

    .explain {
      margin-top: 12px;
      background: #f9fafb;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.92rem;
      color: #374151;
    }

    .cards {
      margin-top: 16px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .result-card {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      background: #fff;
    }

    .result-card h3 {
      margin: 0;
      font-size: 0.86rem;
      color: #4b5563;
      font-weight: 600;
    }

    .value-main {
      margin-top: 6px;
      font-weight: 700;
      font-size: 1.06rem;
    }

    .value-sub {
      margin-top: 4px;
      color: #6b7280;
      font-size: 0.86rem;
    }

    .chart-wrap {
      margin-top: 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      padding: 12px;
    }

    canvas {
      width: 100%;
      height: 290px;
      display: block;
      border-radius: 10px;
      background: #ffffff;
    }

    .legend {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      font-size: 0.84rem;
      color: #4b5563;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
      vertical-align: -1px;
    }

    .summary-band {
      margin-top: 10px;
      background: var(--ok-bg);
      color: var(--ok);
      border: 1px solid #a7f3d0;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.92rem;
    }

    footer {
      margin-top: 18px;
      color: #6b7280;
      font-size: 0.8rem;
    }

    @media (max-width: 760px) {
      .input-grid,
      .cards {
        grid-template-columns: 1fr;
      }

      canvas { height: 240px; }
    }
  </style>
</head>
<body>
