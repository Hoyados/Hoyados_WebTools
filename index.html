<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ベイズ成功確率推定ツール</title>
  <style>
    :root {
      --bg: #ffffff;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --accent: #2563eb;
      --accent-soft: #dbeafe;
      --danger: #b91c1c;
      --danger-bg: #fee2e2;
      --ok: #065f46;
      --ok-bg: #d1fae5;
      --shadow: 0 8px 24px rgba(17, 24, 39, 0.06);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.6;
    }

    .container {
      max-width: 980px;
      margin: 0 auto;
      padding: 20px 16px 32px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.4rem, 2.4vw, 1.9rem);
      line-height: 1.35;
    }

    .lead {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 0.97rem;
    }

    .panel {
      margin-top: 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .input-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .field label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 0.94rem;
    }

    .field input,
    .field select {
      width: 100%;
      height: 40px;
      border: 1px solid #cfd6e4;
      border-radius: 10px;
      padding: 0 10px;
      font-size: 1rem;
      background: #fff;
      color: var(--text);
    }

    .field input:focus,
    .field select:focus {
      outline: 2px solid var(--accent-soft);
      border-color: var(--accent);
    }

    .samples {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .sample-btn {
      border: 1px solid #c7d2fe;
      color: #1e3a8a;
      background: #eef2ff;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .error-box {
      margin-top: 12px;
      background: var(--danger-bg);
      color: var(--danger);
      border: 1px solid #fecaca;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.92rem;
      display: none;
    }

    .explain {
      margin-top: 12px;
      background: #f9fafb;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.92rem;
      color: #374151;
    }

    .cards {
      margin-top: 16px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .result-card {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      background: #fff;
    }

    .result-card h3 {
      margin: 0;
      font-size: 0.86rem;
      color: #4b5563;
      font-weight: 600;
    }

    .value-main {
      margin-top: 6px;
      font-weight: 700;
      font-size: 1.06rem;
    }

    .value-sub {
      margin-top: 4px;
      color: #6b7280;
      font-size: 0.86rem;
    }

    .chart-wrap {
      margin-top: 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      padding: 12px;
    }

    canvas {
      width: 100%;
      height: 290px;
      display: block;
      border-radius: 10px;
      background: #ffffff;
    }

    .legend {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      font-size: 0.84rem;
      color: #4b5563;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
      vertical-align: -1px;
    }

    .summary-band {
      margin-top: 10px;
      background: var(--ok-bg);
      color: var(--ok);
      border: 1px solid #a7f3d0;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.92rem;
    }

    footer {
      margin-top: 18px;
      color: #6b7280;
      font-size: 0.8rem;
    }

    @media (max-width: 760px) {
      .input-grid,
      .cards {
        grid-template-columns: 1fr;
      }

      canvas { height: 240px; }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>成功確率 p のベイズ推定（Beta-Binomial）</h1>
    <p class="lead">
      「成功回数」と「試行回数」から、真の成功確率 p がどのあたりにありそうかを、
      ベイズ推定で直感的に表示します。
    </p>

    <section class="panel" aria-label="入力エリア">
      <div class="input-grid">
        <div class="field">
          <label for="success">成功回数</label>
          <input id="success" type="number" min="0" step="1" value="50" inputmode="numeric" />
        </div>
        <div class="field">
          <label for="trials">試行回数</label>
          <input id="trials" type="number" min="1" step="1" value="100" inputmode="numeric" />
        </div>
        <div class="field">
          <label for="level">信用区間レベル</label>
          <select id="level">
            <option value="0.90">90%</option>
            <option value="0.95" selected>95%</option>
            <option value="0.99">99%</option>
          </select>
        </div>
      </div>

      <div class="samples" aria-label="サンプル入力">
        <button class="sample-btn" type="button" data-s="1" data-n="1">例: 1 / 1</button>
        <button class="sample-btn" type="button" data-s="0" data-n="10">例: 0 / 10</button>
        <button class="sample-btn" type="button" data-s="50" data-n="100">例: 50 / 100</button>
      </div>

      <div id="errorBox" class="error-box" role="alert"></div>

      <div class="explain">
        ここでは「最初は何も知らない」という弱い仮定 <strong>Beta(1,1)</strong> を事前分布に使います。
        データを観測した後は <strong>Beta(成功回数+1, 失敗回数+1)</strong> が事後分布になります。
      </div>

      <div id="summaryBand" class="summary-band"></div>

      <div class="cards" id="cards"></div>

      <div class="chart-wrap">
        <canvas id="posteriorChart" width="920" height="290" aria-label="事後分布グラフ"></canvas>
        <div class="legend">
          <span><span class="dot" style="background:#2563eb"></span>事後分布の曲線</span>
          <span><span class="dot" style="background:#93c5fd"></span>信用区間</span>
          <span><span class="dot" style="background:#16a34a"></span>事後平均</span>
          <span><span class="dot" style="background:#f97316"></span>事後中央値</span>
          <span><span class="dot" style="background:#7c3aed"></span>最頻値（定義できるとき）</span>
        </div>
      </div>
    </section>

    <footer>
      ※ 数値計算は JavaScript のみで実装（依存ライブラリなし）。GitHub Pages でそのまま動きます。
    </footer>
  </main>

  <script>
    "use strict";

    const successEl = document.getElementById("success");
    const trialsEl = document.getElementById("trials");
    const levelEl = document.getElementById("level");
    const errorBox = document.getElementById("errorBox");
    const summaryBand = document.getElementById("summaryBand");
    const cards = document.getElementById("cards");
    const canvas = document.getElementById("posteriorChart");
    const ctx = canvas.getContext("2d");

    const EPS = 1e-12;

    // Lanczos approximation for log-gamma.
    function logGamma(z) {
      const p = [
        676.5203681218851, -1259.1392167224028, 771.3234287776531,
        -176.6150291621406, 12.507343278686905, -0.13857109526572012,
        9.984369578019572e-6, 1.5056327351493116e-7
      ];

      if (z < 0.5) {
        return Math.log(Math.PI) - Math.log(Math.sin(Math.PI * z)) - logGamma(1 - z);
      }

      z -= 1;
      let x = 0.9999999999998099;
      for (let i = 0; i < p.length; i++) {
        x += p[i] / (z + i + 1);
      }

      const t = z + p.length - 0.5;
      return 0.9189385332046727 + (z + 0.5) * Math.log(t) - t + Math.log(x);
    }

    function logBeta(a, b) {
      return logGamma(a) + logGamma(b) - logGamma(a + b);
    }

    // Continued fraction for incomplete beta function.
    function betaContinuedFraction(a, b, x) {
      const maxIter = 200;
      const fpMin = 1e-30;
      let qab = a + b;
      let qap = a + 1;
      let qam = a - 1;
      let c = 1;
      let d = 1 - (qab * x) / qap;
      if (Math.abs(d) < fpMin) d = fpMin;
      d = 1 / d;
      let h = d;

      for (let m = 1; m <= maxIter; m++) {
        const m2 = 2 * m;
        let aa = (m * (b - m) * x) / ((qam + m2) * (a + m2));
        d = 1 + aa * d;
        if (Math.abs(d) < fpMin) d = fpMin;
        c = 1 + aa / c;
        if (Math.abs(c) < fpMin) c = fpMin;
        d = 1 / d;
        h *= d * c;

        aa = (-(a + m) * (qab + m) * x) / ((a + m2) * (qap + m2));
        d = 1 + aa * d;
        if (Math.abs(d) < fpMin) d = fpMin;
        c = 1 + aa / c;
        if (Math.abs(c) < fpMin) c = fpMin;
        d = 1 / d;
        const delta = d * c;
        h *= delta;

        if (Math.abs(delta - 1) < 3e-10) {
          break;
        }
      }

      return h;
    }

    // Regularized incomplete beta I_x(a,b).
    function betaCdf(x, a, b) {
      if (x <= 0) return 0;
      if (x >= 1) return 1;

      const bt = Math.exp(a * Math.log(x) + b * Math.log(1 - x) - logBeta(a, b));
      if (x < (a + 1) / (a + b + 2)) {
        return (bt * betaContinuedFraction(a, b, x)) / a;
      }
      return 1 - (bt * betaContinuedFraction(b, a, 1 - x)) / b;
    }

    function betaQuantile(prob, a, b) {
      if (prob <= 0) return 0;
      if (prob >= 1) return 1;

      // Binary search (robust and sufficient for this UI).
      let lo = 0;
      let hi = 1;
      for (let i = 0; i < 80; i++) {
        const mid = (lo + hi) / 2;
        const cdf = betaCdf(mid, a, b);
        if (cdf > prob) {
          hi = mid;
        } else {
          lo = mid;
        }
      }
      return (lo + hi) / 2;
    }

    function betaPdf(x, a, b) {
      if (x <= 0 || x >= 1) return 0;
      return Math.exp((a - 1) * Math.log(x) + (b - 1) * Math.log(1 - x) - logBeta(a, b));
    }

    function formatProb(x) {
      const pct = (x * 100).toFixed(2) + "%";
      const zeroOne = x.toFixed(4);
      return { pct, zeroOne };
    }

    function validateInputs(success, trials) {
      if (!Number.isInteger(trials) || trials <= 0) {
        return "試行回数は 1 以上の整数で入力してください。";
      }
      if (!Number.isInteger(success) || success < 0) {
        return "成功回数は 0 以上の整数で入力してください。";
      }
      if (success > trials) {
        return "成功回数は試行回数以下にしてください。";
      }
      return "";
    }

    function drawChart(params) {
      const { a, b, ciLow, ciHigh, mean, median, mode } = params;
      const W = canvas.width;
      const H = canvas.height;
      const pad = { l: 48, r: 16, t: 20, b: 30 };
      const innerW = W - pad.l - pad.r;
      const innerH = H - pad.t - pad.b;

      ctx.clearRect(0, 0, W, H);

      const n = 360;
      const xs = [];
      const ys = [];
      let yMax = 0;
      for (let i = 0; i <= n; i++) {
        const x = i / n;
        // Keep away from exact 0 and 1 for numerical stability.
        const xSafe = Math.min(1 - EPS, Math.max(EPS, x));
        const y = betaPdf(xSafe, a, b);
        xs.push(x);
        ys.push(y);
        if (isFinite(y)) yMax = Math.max(yMax, y);
      }
      yMax = yMax * 1.1 || 1;

      const px = (x) => pad.l + x * innerW;
      const py = (y) => pad.t + innerH - (y / yMax) * innerH;

      // Axis.
      ctx.strokeStyle = "#cfd6e4";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(pad.l, pad.t);
      ctx.lineTo(pad.l, pad.t + innerH);
      ctx.lineTo(pad.l + innerW, pad.t + innerH);
      ctx.stroke();

      // X ticks.
      ctx.fillStyle = "#6b7280";
      ctx.font = "12px sans-serif";
      for (let t = 0; t <= 10; t++) {
        const xv = t / 10;
        const xPix = px(xv);
        ctx.strokeStyle = "#eef2f7";
        ctx.beginPath();
        ctx.moveTo(xPix, pad.t);
        ctx.lineTo(xPix, pad.t + innerH);
        ctx.stroke();
        ctx.fillText(xv.toFixed(1), xPix - 10, pad.t + innerH + 16);
      }

      // CI fill.
      ctx.fillStyle = "rgba(147,197,253,0.42)";
      ctx.beginPath();
      let started = false;
      for (let i = 0; i <= n; i++) {
        const x = xs[i];
        if (x < ciLow || x > ciHigh) continue;
        const xPix = px(x);
        const yPix = py(ys[i]);
        if (!started) {
          ctx.moveTo(xPix, py(0));
          ctx.lineTo(xPix, yPix);
          started = true;
        } else {
          ctx.lineTo(xPix, yPix);
        }
      }
      if (started) {
        for (let i = n; i >= 0; i--) {
          const x = xs[i];
          if (x < ciLow || x > ciHigh) continue;
          ctx.lineTo(px(x), py(0));
        }
      }
      ctx.closePath();
      ctx.fill();

      // Density curve.
      ctx.strokeStyle = "#2563eb";
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let i = 0; i <= n; i++) {
        const xPix = px(xs[i]);
        const yPix = py(ys[i]);
        if (i === 0) ctx.moveTo(xPix, yPix);
        else ctx.lineTo(xPix, yPix);
      }
      ctx.stroke();

      const drawMarker = (x, color, label) => {
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(px(x), pad.t);
        ctx.lineTo(px(x), pad.t + innerH);
        ctx.stroke();
        ctx.fillStyle = color;
        ctx.fillText(label, Math.min(px(x) + 3, W - 56), pad.t + 12);
      };

      drawMarker(mean, "#16a34a", "平均");
      drawMarker(median, "#f97316", "中央値");
      if (mode !== null) {
        drawMarker(mode, "#7c3aed", "最頻値");
      }
    }

    function render() {
      const success = Number(successEl.value);
      const trials = Number(trialsEl.value);
      const level = Number(levelEl.value);

      const err = validateInputs(success, trials);
      if (err) {
        errorBox.style.display = "block";
        errorBox.textContent = err;
        cards.innerHTML = "";
        summaryBand.textContent = "入力が有効になると推定結果を表示します。";
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        return;
      }
      errorBox.style.display = "none";

      const failures = trials - success;
      const a = success + 1;
      const b = failures + 1;

      const obs = success / trials;
      const mean = a / (a + b);
      const median = betaQuantile(0.5, a, b);

      let mode = null;
      let modeLabel = "端に張り付く形になり、通常の意味での最頻値は定義できません。";
      if (a > 1 && b > 1) {
        mode = (a - 1) / (a + b - 2);
        modeLabel = "定義可能";
      }

      const alpha = 1 - level;
      const ciLow = betaQuantile(alpha / 2, a, b);
      const ciHigh = betaQuantile(1 - alpha / 2, a, b);

      const obsF = formatProb(obs);
      const meanF = formatProb(mean);
      const medF = formatProb(median);
      const ciLowF = formatProb(ciLow);
      const ciHighF = formatProb(ciHigh);

      let modeTextMain;
      let modeTextSub;
      if (mode !== null) {
        const modeF = formatProb(mode);
        modeTextMain = `${modeF.pct}`;
        modeTextSub = `0〜1表記: ${modeF.zeroOne}`;
      } else {
        modeTextMain = "定義不可（境界で最大）";
        modeTextSub = "a<=1 または b<=1 のため";
      }

      cards.innerHTML = `
        <article class="result-card">
          <h3>観測比率（成功回数 / 試行回数）</h3>
          <div class="value-main">${obsF.pct}</div>
          <div class="value-sub">0〜1表記: ${obsF.zeroOne}</div>
        </article>
        <article class="result-card">
          <h3>事後平均（期待される成功確率）</h3>
          <div class="value-main">${meanF.pct}</div>
          <div class="value-sub">0〜1表記: ${meanF.zeroOne}</div>
        </article>
        <article class="result-card">
          <h3>事後中央値</h3>
          <div class="value-main">${medF.pct}</div>
          <div class="value-sub">0〜1表記: ${medF.zeroOne}</div>
        </article>
        <article class="result-card">
          <h3>最頻値（モード）</h3>
          <div class="value-main">${modeTextMain}</div>
          <div class="value-sub">${modeTextSub}</div>
        </article>
        <article class="result-card" style="grid-column: 1 / -1;">
          <h3>${Math.round(level * 100)}% 信用区間</h3>
          <div class="value-main">${ciLowF.pct} 〜 ${ciHighF.pct}</div>
          <div class="value-sub">0〜1表記: ${ciLowF.zeroOne} 〜 ${ciHighF.zeroOne}</div>
        </article>
      `;

      summaryBand.textContent = `
        この結果では、真の成功確率 p は ${Math.round(level * 100)}% の確からしさで
        ${ciLowF.pct} 〜 ${ciHighF.pct} の範囲にあると考えられます。
        試行回数が少ないほど分布が広がり、不確実性が大きく見えます。
      `.replace(/\s+/g, " ").trim();

      drawChart({ a, b, ciLow, ciHigh, mean, median, mode });
    }

    [successEl, trialsEl, levelEl].forEach((el) => {
      el.addEventListener("input", render);
      el.addEventListener("change", render);
    });

    document.querySelectorAll(".sample-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        successEl.value = btn.dataset.s;
        trialsEl.value = btn.dataset.n;
        render();
      });
    });

    render();
  </script>
</body>
</html>
