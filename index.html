<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoyados personal tools</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f5f7fb;
            --panel: rgba(255, 255, 255, 0.78);
            --panel-strong: #ffffff;
            --text: #16223d;
            --muted: #5c6783;
            --accent: #4f7cff;
            --accent-2: #7b5cff;
            --outline: rgba(103, 124, 184, 0.2);
            --shadow: 0 30px 80px rgba(29, 48, 94, 0.14);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Inter", "Segoe UI", "Noto Sans JP", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 15% 12%, rgba(79, 124, 255, 0.26), transparent 40%),
                radial-gradient(circle at 85% 10%, rgba(123, 92, 255, 0.22), transparent 36%),
                linear-gradient(180deg, #f8faff 0%, #edf1fa 100%);
            padding: 36px 16px;
        }

        .shell {
            width: min(1080px, 100%);
            margin: 0 auto;
            background: var(--panel);
            border-radius: 28px;
            border: 1px solid var(--outline);
            box-shadow: var(--shadow);
            backdrop-filter: blur(16px);
            overflow: hidden;
        }

        .hero {
            padding: 38px 34px 24px;
            border-bottom: 1px solid rgba(103, 124, 184, 0.16);
            background: linear-gradient(130deg, rgba(79, 124, 255, 0.12), rgba(123, 92, 255, 0.08), rgba(255, 255, 255, 0.4));
        }

        .meta {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 0.8rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--accent);
            background: rgba(79, 124, 255, 0.12);
            margin-bottom: 14px;
            font-weight: 700;
        }

        h1 { margin: 0; font-size: clamp(1.9rem, 4vw, 2.7rem); }

        .lead {
            margin: 12px 0 0;
            max-width: 64ch;
            color: var(--muted);
            line-height: 1.75;
        }

        .link-list {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
            padding: 26px;
        }

        .tool-link {
            text-decoration: none;
            color: inherit;
            background: var(--panel-strong);
            border-radius: 18px;
            border: 1px solid rgba(108, 129, 189, 0.25);
            padding: 18px 18px 16px;
            transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
            display: grid;
            gap: 10px;
            min-height: 134px;
        }

        .tool-link:hover {
            transform: translateY(-4px);
            border-color: rgba(79, 124, 255, 0.55);
            box-shadow: 0 20px 38px rgba(66, 98, 191, 0.18);
        }

        .tool-main {
            display: flex;
            align-items: flex-start;
            gap: 11px;
        }

        .emoji {
            width: 2.25rem;
            height: 2.25rem;
            display: grid;
            place-items: center;
            border-radius: 12px;
            background: linear-gradient(145deg, rgba(79, 124, 255, 0.14), rgba(123, 92, 255, 0.12));
            font-size: 1.2rem;
        }

        .tool-title { font-size: 1.04rem; font-weight: 700; }
        .tool-sub { color: var(--muted); font-size: 0.9rem; line-height: 1.5; margin-top: 3px; }
        .arrow { margin-left: auto; color: var(--accent); font-weight: 700; }

        .caption {
            padding: 0 30px 26px;
            color: #7883a1;
            font-size: .84rem;
            text-align: right;
        }

        @media (max-width: 760px) {
            .hero { padding: 30px 20px 18px; }
            .link-list { grid-template-columns: 1fr; padding: 18px; }
            .caption { padding: 0 20px 18px; text-align: left; }
            .tool-link { min-height: auto; }
        }
    </style>
</head>
<body>
    <div class="shell">
        <header class="hero">
            <div class="meta">Utility Hub</div>
            <h1>Hoyados Personal Tools</h1>
            <p class="lead">日々の作業で使うツールを、用途別にすぐ起動できるよう整理しました。視認性・操作性を重視した新UIです。</p>
        </header>

        <div class="link-list">
            <a class="tool-link" href="ddr_flare_gauge.html">
                <div class="tool-main">
                    <span class="emoji">🎵</span>
                    <div>
                        <div class="tool-title">DDRフレアゲージ計算機</div>
                        <div class="tool-sub">判定数からフレアゲージ減少量を即時計算</div>
                    </div>
                </div>
                <span class="arrow">開く →</span>
            </a>
            <a class="tool-link" href="sorting_visualizer.html">
                <div class="tool-main">
                    <span class="emoji">📊</span>
                    <div>
                        <div class="tool-title">ソートアルゴリズム可視化ツール</div>
                        <div class="tool-sub">複数アルゴリズムの挙動・コストを横並びで比較</div>
                    </div>
                </div>
                <span class="arrow">開く →</span>
            </a>
            <a class="tool-link" href="csv_dashboard.html">
                <div class="tool-main">
                    <span class="emoji">🧾</span>
                    <div>
                        <div class="tool-title">CSV自動ダッシュボード</div>
                        <div class="tool-sub">CSVの構造推定・集計・グラフ表示をワンストップで</div>
                    </div>
                </div>
                <span class="arrow">開く →</span>
            </a>
            <a class="tool-link" href="gacha_simulator.html">
                <div class="tool-main">
                    <span class="emoji">🎯</span>
                    <div>
                        <div class="tool-title">ガチャシミュレータ</div>
                        <div class="tool-sub">排出率・回数・コストを設定して期待値を可視化</div>
                    </div>
                </div>
                <span class="arrow">開く →</span>
            </a>
        </div>

        <div class="caption">Hoyados personal tools</div>
    </div>
</body>
</html>
